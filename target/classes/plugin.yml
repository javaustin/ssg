name: ssg
version: '0.0'
main: com.carrotguy69.ssg.SpeedSG
api-version: '1.21'

depend:
  - cxyz
  - WorldEdit

softdepend:
  - PlaceholderAPI

commands:
  test:
    description: Test this command
    usage: /test <content>
    permission: "ssg.test"

  print:
    description: Print
    usage: /test <content>
    permission: "ssg.test"

  game:
    description: Create, join, or leave a SpeedSG game
    usage: /game <create | delete | join | leave>
    permission: "ssg.game"

  team:
    description: Join or leave a SpeedSG team
    usage: /team <join | leave | list>
    permission: "ssg.team"

permissions:
  ssg.test:
    default: op

  ssg.print:
    default: op

  ssg.game:
    default: true
  ssg.game.create:
    default: op
  ssg.game.delete:
    default: op
  ssg.game.join:
    default: true
  ssg.game.leave:
    default: true

  ssg.team:
    default: true
  ssg.team.join:
    default: true
  ssg.team.leave:
    default: true
  ssg.team.list:
    default: true