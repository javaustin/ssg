maps:
  lobby:
    # IMPORTANT: do not rename or delete this map
    # This is the waiting lobby players will be teleported to if a game is not active.
    source:
      type: STATIC

    world: "world"

    spawns:
      - {world: "world", x: -508, y: 85, z: -597, yaw: 90.0, pitch: 0.0}

    bounds:
      pos1:
        - {world: "world", x: -480, y: 113, z: -547, yaw: 0.0, pitch: 0.0}
      pos2:
        - {world: "world", x: -580, y: 98, z: -647, yaw: 0.0, pitch: 45.0}
