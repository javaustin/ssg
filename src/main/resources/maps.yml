  static:
    display-name: "STATIC"

    source:
      type: STATIC

    world: "world"

    spawns:
      - {world: "world", x: -530, y: 80, z: -589, yaw: 180.0, pitch: 0.0}
      - {world: "world", x: -522, y: 80, z: -597, yaw: 90.0, pitch: 0.0}
      - {world: "world", x: -530, y: 80, z: -605, yaw: 0.0, pitch: 0.0}
      - {world: "world", x: -538, y: 80, z: -597, yaw: 0.0, pitch: 0.0}

    bounds:
      pos1:
        - {world: "world", x: -480, y: 113, z: -547, yaw: 0.0, pitch: 0.0}
      pos2:
        - {world: "world", x: -580, y: 98, z: -647, yaw: 0.0, pitch: 45.0}

    world-border:
      enabled: true
      shrink: true
      final-width: 10
      seconds: 60