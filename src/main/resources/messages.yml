# the gamePlayer formatter includes:
#     playerFormatter
#     player-team = player-team-prefix
#     player-team-color
#     player-dead

indicators:
  # Indicators that display on a gamePlayer
  alive-indicator: ""
  dead-indicator: "&7&lDEAD "

lobby:
  # gamePlayer
  chat: "{player-team-prefix}{player-rank-prefix}{player-rank-color}{player}: {player-chat-color}{content}" # + content
  join: "{player-rank-prefix}{player-rank-color}{player} &ejoined the lobby."
  leave: "{player-rank-prefix}{player-rank-color}{player} &eleft the lobby."

  # teamFormatter, gamePlayer
  team:
    join: "You joined {team-color}{team-name}"
    join-announcement: "{player-team-color}{player} joined the team"

    leave: "You left {team-color}{team-name}"
    leave-announcement: "{player-team-color}{player} left the team"

    list:
      list: |
        {player-team-name}: 
        {members}

      team-members-list:
        entry-format: "{player-rank-color}{player}"
        separator: ", "
        max-entries: 9999
    
    


  info:
    start-countdown: "&eGame starting in &6{count} &eseconds." # + {count}
    start-cancel: "&eStart cancelled! There are not enough players to start a game. You will be teleported to the lobby..." # N/A

game:
  # gamePlayer
  chat: "{player-dead}{player-team-prefix}{player-rank-color}{player}: &f{content}" # + {content}
  join: "{player-rank-prefix}{player-rank-color}{player} &ejoined the game."
  leave: "{player-rank-prefix}{player-rank-color}{player} &eleft the game."


  info:
    blurb: |
        &f-------------------- &6&lSpeed&e&lSG &f--------------------
        &eblurb something something something
        -----------------------------------------------------
    start-cancel: "&eStart cancelled! There are not enough players to start a game." # N/A
    invul-countdown: "&cInvulnerability wears off in {count} seconds." # {count}
    invul-over: "&4Invulnerability has worn off!"
    refill-announcement: "&6Chests refilled!" # N/A

    mid-game-join:
      title:
        title: "&aYou are spectating!"
        subtitle: "&eYou will spawn in the next round!"
        fade-in-ticks: 0
        stay-ticks: 40
        fade-out-ticks: 20

      message: "&aYou have joined as a spectator, use your hotbar to teleport to other players."

    showdown:
      title:
        title: "&6&lSHOWDOWN"
        subtitle: "&eThe world border will start shrinking!"
        fade-in-ticks: 0
        stay-ticks: 40
        fade-out-ticks: 20

      message: "&6The world border will start shrinking!"


  # ALL (if applicable): playerFormatter ({player}, {attacker}), teamFormatter ({team})
  death:
    announcement:

      team:
        default: "&4{team}&4has been eliminated!"

      player:
        melee: "&c{player} was killed by {attacker}!"
        projectile: "&c{player} was shot by {attacker}!"
        explosive: "&c{player} was blown up by {attacker}!"
        default: "&c{player} died!"

    message:
      team:
        default: ""

      player:
        melee: ""
        projectile: ""
        explosive: ""
        default: ""

    title-with-respawn:
      title: "&c&lYOU DIED!"
      subtitle: "&aYou will respawn in &f{count} &aseconds." # {count}
      fade-in-ticks: 0
      stay-ticks: 40
      fade-out-ticks: 20

    title-with-no-respawn:
      title: "&c&lYOU DIED!"
      subtitle: "&eBetter luck next time!"
      fade-in-ticks: 0
      stay-ticks: 40
      fade-out-ticks: 20


  # gamePlayerFormatter {player}, teamFormatter {team}
  kill:
    message:
      team:
        default: ""

      player:
        melee: ""
        projectile: ""
        explosive: ""
        default: ""


  # N/A
  respawn:
    title:
      title: "&a&lRespawned!"
      subtitle: ""
      fade-in-ticks: 0
      stay-ticks: 40
      fade-out-ticks: 20

    message: "&aYou have been respawned!"


  # gamePlayerFormatter ({winner-player}, {player}), teamFormatter ({winner-team}, {team})
  win:
    victory-title:
      title: "&6&lVICTORY"
      subtitle: "&eYou've won the match!"
      fade-in-ticks: 0
      stay-ticks: 40
      fade-out-ticks: 20

    lose-title:
      title: "&6&lGame over!"
      subtitle: "&eBetter luck next time!"
      fade-in-ticks: 0
      stay-ticks: 40
      fade-out-ticks: 20


  recaps:
    # This defines the {top-killers} placeholder in the recaps. {i} represents the position number in the leaderboard.
    top-killers-numbered-list:
      entry-format: "{player-rank-color}{player}: &7{player-temp-stat-kills} kills"
      separator: "\n&f{i}.)) "
      max-entries: 3

    # This defines the {team-members} placeholder in the recaps
    team-list:
      entry-format: "{player-rank-color}{player}"
      separator: ", "
      max-entries: 9999

    # You can still use the team formatter {team} in the solo-winner recap.
    solo-winner: |
      ---------------------------------------------
      {winner-player-rank-color}{winner-player} &6&lwon the game!
      &4Final health: {winner-player-health}
      &cRound kills: {winner-player-temp-stat-kills}
      &6Lifetime kills: {winner-player-stat-sg-lifetime-kills}
      &eLifetime wins: {winner-player-stat-sg-lifetime-wins}
      
      Top killers:{top-killers}
      ---------------------------------------------

    team-winner: |
      ---------------------------------------------
      {winner-team-color}{winner-team} &6&lwon the game!
      Members: {winner-team-members}
      
      Top killers:{top-killers}
      ---------------------------------------------



command:
  # gameFormatter
  create: "[&aCreated new game ((id: {game-id}))!](HOVER:&eClick to join)(RUN_COMMAND:/game join {game-id})"
  delete: "&aDeleted game {game-id}"
  join: "&aYou joined game {game-id}!"
  leave: "&aYou left game {game-id}!"

  list:
    message: |
      &f---------- &6&lSSG Available Games &r&f----------
      {games}
      [&f< Previous](RUN_COMMAND:/game list {previous-page})   &7Page {page}/{max-pages}   [&fNext >](RUN_COMMAND:/game list {next-page})
    blank: "&cThere are no SSG games running!"
    entry-format: "&f* [&a{game-id} (({game-team-capacity})) on {game-map} (({game-size} players))](HOVER:&eClick to join {game-id})(RUN_COMMAND:/game join {game-id})"
    separator: "\n"
    max-entries-per-page: 5

errors:

  game:
    no-games: "&cThere are no SSG games running!"
    duplicate-game: "&cThis game already exists!"
    duplicate-game-join: "&cYou are already in this game!"
    already-in-game: "&cYou are already in a game!"
    not-in-game: "&cYou are not in a game."

  team:
    full: "&eThis team is full!"
    no-switching: "&cYou may not switch teams at this time."
    not-in-team: "&eYou are not in a team!"
    already-in-team: "&eYou are already in this team!"

  command:
    no-access: "[&cYou do not have access to this command!](HOVER:&cYou do not have the required permission: {permission})"
    player-only: "&cThis command must be used by a player!"

  player:
    is-offline: "&cThis player is offline!" # Format MF.playerFormatter(target);
    is-self: "&cYou cannot use this command on yourself!" # no format
    not-found: "[&cPlayer not found!](HOVER:&7Could not find player with the username of &f{username}&7!)" # Format: username

  args:
    missing:
      general: "&cThis command is missing the required argument((s)): &f{missing-args}" # format w/ {missing-args}, {syntax}

    invalid:
      game: "&cGame not found!"
      map: "&cMap not found!"
      team: "&cTeam not found!"
      loot-table: "&cPlease provide a valid loot table!"
      team-capacity: "&cPlease provide a valid mode ((solos, duos, trios, squads))."